name: Build downloadable ARM64 image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: pvlane:arm64
          outputs: type=docker,dest=${{ runner.temp }}/pvlane-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare TAR image and create checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pvlane-artifact"
          mv "$RUNNER_TEMP/pvlane-arm64.tar" "$RUNNER_TEMP/pvlane-artifact/pvlane-arm64.tar"
          cd "$RUNNER_TEMP/pvlane-artifact"
          sha256sum pvlane-arm64.tar > pvlane-arm64.tar.sha256

      - name: Upload image for download
        uses: actions/upload-artifact@v4
        with:
          name: pvlane-arm64-image
          path: ${{ runner.temp }}/pvlane-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
