server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF.js workers may use .mjs, which needs a JavaScript MIME type.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # Missing assets should return 404 instead of the SPA HTML document.
    location /assets/ {
        try_files $uri =404;
    }

    location /pdfjs/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
